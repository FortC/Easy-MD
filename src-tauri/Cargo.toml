[package]
name = "easymd"
version = "0.3.5"
description = "EasyMD - 本地优先 Markdown 知识库"
authors = ["easymd"]
edition = "2021"

[lib]
name = "easymd_lib"
# 仅桌面 Windows：cdylib 仅供移动端打包使用，且 rustc 在 windows-gnu 工具链下会为
# cdylib 生成超过 PE 65535 导出符号上限的 .def 导致链接失败，故不构建
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
notify = "8"
walkdir = "2"
regex = "1"
trash = "5"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
percent-encoding = "2"
winreg = "0.52"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }

# 发布构建：小体积优先
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
